# The agents' review of a pull request. The reviewer, tester, critic and business analyst
# each read the PR on Sonnet in a job of their own, side by side, and one comment on the PR
# puts their reports together; a new push updates the same comment. Repos call this from
# their own .github/workflows/agents.yml (see the README). The legal agent never runs here.
#
# Claude signs in with the calling repo's CLAUDE_CODE_OAUTH_TOKEN secret from
# `claude setup-token`, so it runs on my subscription, never an API key. Claude only gets
# tools that read; the last job posts the comment with the workflow's own token.
#
# Each agent runs as the session itself (`--agent`) rather than as a subagent of a
# coordinating session: in CI a coordinator answered before its subagents had reported.
name: Agents

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

env:
  PR: ${{ github.event.pull_request.number }}
  GH_TOKEN: ${{ github.token }}

jobs:
  changes:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Every job has its own group, so a new push cancels the same job of the run before.
    concurrency:
      group: agents-${{ github.repository }}-${{ github.event.pull_request.number }}-changes
      cancel-in-progress: true
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: See what changed
        id: changes
        run: |
          files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)"
          echo "Changed files:"
          echo "$files"
          # Docs only (Markdown, text, images, docs/, LICENSE): nothing for the agents to review.
          code="$(grep -Ev '\.(md|mdx|txt|png|jpe?g|gif|svg|webp)$|^docs/|(^|/)LICENSE$' <<<"$files" || true)"
          if [ -n "$code" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
            echo "Only docs changed, so the agents skip this PR."
          fi

  review:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: agents-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ matrix.agent }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: reviewer
            task: Review the whole pull request.
          - agent: tester
            task: >-
              Don't write, edit or run tests or builds here. From the diff and the existing tests,
              say what the change tests, what it leaves untested, and which tests to add.
              `gh pr checks ${{ github.event.pull_request.number }}` shows how the PR's other checks did.
          - agent: critic
            task: Say what's weak or risky in this pull request.
          - agent: business-analyst
            task: Say whether this change is worth it, who it's for, and what's missing.
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install the agents
        uses: germanndarian/agents-ci/.github/actions/agents@main

      - name: Run the ${{ matrix.agent }}
        id: agent
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} goes from
            ${{ github.event.pull_request.head.ref }} into ${{ github.event.pull_request.base.ref }}.
            `gh pr view ${{ github.event.pull_request.number }}` shows its title and description,
            `gh pr diff ${{ github.event.pull_request.number }}` shows the change, and the code is
            checked out in the working directory.

            This runs in CI: nobody can answer questions, and nothing may be changed, committed
            or pushed.

            Your task: ${{ matrix.task }}
            Answer with your report only, in Markdown.
          # --agent runs the session as that agent. With it, Claude Code ignores --json-schema,
          # so the report is read from the run's last message instead.
          claude_args: >-
            --agent ${{ matrix.agent }}
            --model sonnet
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"
            --disallowedTools "Edit,Write,NotebookEdit,Agent"

      - name: Save the report
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          AGENT: ${{ matrix.agent }}
        run: |
          mkdir -p report
          last='[.[] | select(.type == "result")] | last'
          if [ -f "$EXECUTION_FILE" ] && [ "$(jq -r "$last | .is_error" "$EXECUTION_FILE")" = false ]; then
            jq -r "$last | .result" "$EXECUTION_FILE" >report/report.md
          else
            # Only the error goes into the log and the comment: a public repo's logs are public.
            error="$([ -f "$EXECUTION_FILE" ] && jq -r "$last | .result // empty" "$EXECUTION_FILE" | head -c 300)"
            echo "The $AGENT didn't finish${error:+: $error}" | tee report/report.md
          fi

      - name: Keep the report for the comment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.agent }}
          path: report/report.md
          retention-days: 1

  comment:
    needs: [changes, review]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    concurrency:
      group: agents-${{ github.repository }}-${{ github.event.pull_request.number }}-comment
      cancel-in-progress: true
    steps:
      - name: Collect the reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports

      - name: Post or update the comment
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          section() { # section <heading> <agent>
            printf '### %s\n\n' "$1"
            if [ -f "reports/report-$2/report.md" ]; then cat "reports/report-$2/report.md"; else echo "The $2 didn't run."; fi
            printf '\n\n'
          }
          # The marker finds the comment again, so each push updates it instead of adding one.
          marker='<!-- agents-review -->'
          body="$(
            printf '%s\n## Agents'"'"' review\n\n' "$marker"
            section Reviewer reviewer
            section Tester tester
            section Critic critic
            section "Business analyst" business-analyst
            printf '<sub>%s · reviewer, tester, critic and business analyst on Sonnet</sub>\n' "${HEAD_SHA::7}"
          )"
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
            echo "Updated comment $id"
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
